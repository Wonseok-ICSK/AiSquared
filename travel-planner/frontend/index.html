<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
    <title>AiSquared Travel</title>
    <script>
      try {
        var t = localStorage.getItem("ast-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("ast-lang");
        document.documentElement.lang = l === "en" ? "en" : "ko";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
